name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Snowy.csproj -c Release

      - name: Test
        run: dotnet test Snowy.Tests/Snowy.Tests.csproj -c Release

      - name: Python reference implementation agrees with the test vectors
        run: python docs/snow2_ref.py
